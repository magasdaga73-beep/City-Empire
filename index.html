<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080b10;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{

 margin:auto;

}

header{

}

.logo{

}

.logo h1{

}

.sub{

.user{

}

.stats{

.stat{

.label{

.card{

}

.icon{

}

.info{

}

.name{

}

.desc{

}

.income{

}

button{
 border:0;
 border-radius:13px;
 padding:11px 13px;

 color:#101319;
 font-weight:900;
 font-size:13px;

 -webkit-tap-highlight-color:transparent
}

button:disabled{

}

.secondary{

 color:#fff
}

.danger{
 background:#c94150;
 color:#fff
}

.green{

 color:#fff
}

.modal{

 inset:0;
 background:#000d;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:20
}

.box{
 width:min(420px,100%);
 max-height:90vh;
 overflow:auto;
 background:#141a23;
 border:1px solid #303b4d;

 padding:22px;
 box-shadow:0 20px 70px #000
}

input{
 width:100%;
 padding:14px;

 border:1px solid #394456;

 color:white;

 margin:8px 0;

}

.error{
 color:#ff7180;
 font-size:13px;
 min-height:20px;
 margin:4px 0
}

.hidden{
 display:none!important
}

.tabs{
 display:flex;
 gap:7px;
 margin-bottom:12px
}

.tabs button{
 flex:1;
 background:#202a38;
 color:#fff
}

.tabs button.active{
 background:#fff;
 color:#111
}

.rank{
 background:#121821;
 border:1px solid #263142;
 border-radius:16px;
 padding:13px;
 margin-bottom:8px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px
}

.rank-left{
 min-width:0
}

.rank-number{
 font-size:18px;
 font-weight:900
}

.rank-name{
 margin-top:3px;
 font-weight:800;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}

.rank-right{
 text-align:right;
 white-space:nowrap
}

.rank-level{
 font-weight:900
}

.rank-xp{
 color:#62e69a;
 font-size:12px;
 margin-top:2px
}

.admin{
 position:fixed;
 inset:0;
 background:#05070bd9;
 z-index:50;
 padding:18px;
 overflow:auto
}

.admin-box{
 width:min(460px,100%);
 margin:auto;
 background:#141a23;
 border:1px solid #354158;
 border-radius:25px;
 padding:20px;
 box-shadow:0 20px 70px #000
}

.admin-title{
 font-size:23px;
 font-weight:900;
 margin-bottom:5px
}

.admin-sub{
 color:#7f8ca1;
 font-size:12px;
 margin-bottom:15px
}

.admin-row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin:8px 0
}

.admin-row button{
 background:#252f40;
 color:#fff
}

.admin-row .danger{
 background:#c94150
}

.close-admin{
 width:100%;
 margin-top:10px
}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#fff;
 color:#111;
 padding:12px 18px;
 border-radius:15px;
 font-weight:800;
 z-index:100;
 box-shadow:0 10px 30px #0008;
 max-width:90%;
 text-align:center
}

footer{
 text-align:center;
 color:#596577;
 font-size:11px;
 margin-top:25px
}
</style>
</head>

<body>

<!-- ================= АВТОРИЗАЦИЯ ================= -->

<div id="auth" class="modal">

 <div class="box">

  <h2>🏙️ Построй Империю</h2>

<div class="app">

<div
 id="admin"
 class="admin hidden">

 <div class="admin-box">

  <div class="admin-title">

  </div>

 </div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://xwlwhcghadlwlmfzsxhp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-PLNU91ClWlotB7n2iz8g_3tvI1Th8";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
   ИГРОВЫЕ ДАННЫЕ
===================================================== */

const defs=[

 {
  key:"house",
  icon:"🏠",
  name:"Дом",
  baseCost:2000,
  income:100
 },

 {
  key:"shop",
  icon:"🏪",
  name:"Магазин",
  baseCost:7500,
  income:450
 },

 {
  key:"gas",
  icon:"⛽",
  name:"АЗС",
  baseCost:20000,
  income:1200
 },

 {
  key:"factory",
  icon:"🏭",
  name:"Завод",
  baseCost:60000,
  income:4000
 }

];


let player=null;
let isRegister=false;
let saving=false;
let adminPressTimer=null;


/* =====================================================
   ВСПОМОГАТЕЛЬНОЕ
===================================================== */

function fmt(n){

 return Math.floor(Number(n)||0)
  .toLocaleString("ru-RU")+" ₽";

}


function escapeHtml(text){

 return String(text||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function showToast(text){

 const t=document.getElementById("toast");

 t.textContent=text;

 t.classList.remove("hidden");

 setTimeout(()=>{
  t.classList.add("hidden");
 },1800);

}


/* =====================================================
   AUTH
===================================================== */

function showLogin(){

 isRegister=false;

 document
  .getElementById("loginTab")
  .classList.add("active");

 document
  .getElementById("registerTab")
  .classList.remove("active");

 document
  .getElementById("registerNickWrap")
  .classList.add("hidden");

 document
  .getElementById("authButton")
  .textContent="Войти";

 document
  .getElementById("authError")
  .textContent="";

}


function showRegister(){

 isRegister=true;

 document
  .getElementById("registerTab")
  .classList.add("active");

 document
  .getElementById("loginTab")
  .classList.remove("active");

 document
  .getElementById("registerNickWrap")
  .classList.remove("hidden");

 document
  .getElementById("authButton")
  .textContent="Создать аккаунт";

 document
  .getElementById("authError")
  .textContent="";

}


async function authAction(){

 const email=
  document
   .getElementById("email")
   .value
   .trim();

 const password=
  document
   .getElementById("password")
   .value;

 const error=
  document.getElementById("authError");

 error.textContent="";
 error.style.color="#ff7180";


 if(!email || !password){

  error.textContent=
   "Заполни e-mail и пароль";

  return;

 }


 if(password.length<6){

  error.textContent=
   "Пароль минимум 6 символов";

  return;

 }


 const button=
  document.getElementById("authButton");

 button.disabled=true;


 try{

  /* ================= РЕГИСТРАЦИЯ ================= */

  if(isRegister){

   const nickname=
    (
     document
      .getElementById("nickname")
      .value
      .trim()
      .slice(0,24)
    ) || "Моя империя";


   const {
    data,
    error:e
   }=
   await db.auth.signUp({

    email:email,

    password:password,

    options:{
     data:{
      nickname:nickname
     }
    }

   });


   if(e) throw e;


   if(!data || !data.user){

    throw new Error(
     "Не удалось создать аккаунт"
    );

   }


   if(data.session){

    await loadPlayer();

   }else{

    error.style.color="#62e69a";

    error.textContent=
     "Аккаунт создан. Теперь войди.";

    showLogin();

   }


  /* ================= ВХОД ================= */

  }else{

   const {
    data,
    error:e
   }=
   await db.auth.signInWithPassword({

    email:email,

    password:password

   });


   if(e) throw e;


   if(!data || !data.user){

    throw new Error(
     "Не удалось выполнить вход"
    );

   }


   await loadPlayer();

  }


 }catch(e){

  console.error("AUTH ERROR:",e);

  let message=
   e.message ||
   "Произошла ошибка";


  if(
   message.toLowerCase()
    .includes("invalid login credentials")
  ){

   message=
    "Неверный e-mail или пароль";

  }


  if(
   message.toLowerCase()
    .includes("email rate limit")
  ){

   message=
    "Слишком много попыток. Подожди немного и попробуй снова.";

  }


  error.textContent=message;


 }finally{

  button.disabled=false;

 }

}


/* =====================================================
   PLAYER
===================================================== */

async function loadPlayer(){

 try{

  const {
   data:{
    user
   }
  }=
  await db.auth.getUser();


  if(!user){

   document
    .getElementById("auth")
    .classList
    .remove("hidden");

   return;

  }


  const {
   data,
   error
  }=
  await db
   .from("players")
   .select("*")
   .eq("id",user.id)
   .maybeSingle();


  if(error){

   console.error(
    "PLAYER ERROR:",
    error
   );

   document
    .getElementById("authError")
    .textContent=
    "Ошибка загрузки города: "+error.message;

   return;

  }


  /* Если строки players нет,
     создаём её автоматически */

  if(!data){

   const nickname=
    (
     user.user_metadata?.nickname ||
     "Моя империя"
    )
    .toString()
    .slice(0,24);


   const {
    data:newPlayer,
    error:createError
   }=
   await db
    .from("players")
    .insert({

     id:user.id,

     nickname:nickname

    })
    .select("*")
    .single();


   if(createError){

    console.error(
     "CREATE PLAYER ERROR:",
     createError
    );

    document
     .getElementById("authError")
     .textContent=
     "Не удалось создать город: "+
     createError.message;

    return;

   }


   player=newPlayer;

  }else{

   player=data;

  }


  document
   .getElementById("auth")
   .classList
   .add("hidden");


  applyOfflineIncome();

  render();

  loadLeaderboard();


 }catch(e){

  console.error(
   "LOAD PLAYER ERROR:",
   e
  );

  document
   .getElementById("authError")
   .textContent=
   e.message ||
   "Ошибка загрузки";

 }

}


async function logout(){

 await db.auth.signOut();

 player=null;

 location.reload();

}


/* =====================================================
   ЭКОНОМИКА
===================================================== */

function buildingIncome(i){

 const d=defs[i];

 const count=
  Number(player[d.key])||0;

 const lvl=
  Number(player[d.key+"_level"])||1;

 return count*d.income*lvl;

}


function totalIncome(){

 if(!player)
  return 0;

 let income=0;

 defs.forEach((d,i)=>{

  income+=buildingIncome(i);

 });

 return income*
  (Number(player.multiplier)||1);

}


function buildingCost(i){

 const d=defs[i];

 const count=
  Number(player[d.key])||0;

 return Math.floor(
  d.baseCost*
  Math.pow(1.18,count)
 );

}


function getLevel(){

 return 1+
  Math.floor(
   (Number(player.xp)||0)/100
  );

}


/* =====================================================
   ОФЛАЙН-ДОХОД
===================================================== */

function applyOfflineIncome(){

 if(!player.last_income_at)
  return;


 const last=
  new Date(
   player.last_income_at
  ).getTime();


 let minutes=
  (Date.now()-last)/60000;


 minutes=
  Math.max(
   0,
   Math.min(minutes,1440)
  );


 const gain=
  totalIncome()*minutes;


 if(gain>0){

  player.money=
   Number(player.money||0)+
   Math.floor(gain);

  player.xp=
   Number(player.xp||0)+
   Math.floor(minutes);

 }


 player.last_income_at=
  new Date().toISOString();


 savePlayer();

}


/* =====================================================
   ПОКУПКА
===================================================== */

async function buy(i){

 if(!player) return;


 const d=defs[i];

 const cost=
  buildingCost(i);


 if(player.money<cost){

  showToast("💸 Не хватает денег");

  return;

 }


 player.money-=cost;

 player[d.key]=
  (Number(player[d.key])||0)+1;

 player.xp+=25;

 render();

 await savePlayer();

 showToast(
  d.icon+" "+d.name+" построен!"
 );

}


/* =====================================================
   СОХРАНЕНИЕ
===================================================== */

async function savePlayer(){

 if(!player || saving)
  return;


 saving=true;


 const now=
  new Date().toISOString();


 const payload={

  id:player.id,

  nickname:
   player.nickname ||
   "Моя империя",

  money:
   Math.floor(Number(player.money)||0),

  house:
   Number(player.house)||0,

  shop:
   Number(player.shop)||0,

  gas:
   Number(player.gas)||0,

  factory:
   Number(player.factory)||0,

  house_level:
   Number(player.house_level)||1,

  shop_level:
   Number(player.shop_level)||1,

  gas_level:
   Number(player.gas_level)||1,

  factory_level:
   Number(player.factory_level)||1,

  xp:
   Math.floor(Number(player.xp)||0),

  multiplier:
   Number(player.multiplier)||1,

  last_income_at:
   player.last_income_at ||
   now,

  updated_at:
   now

 };


 try{

  const {
   error
  }=
  await db
   .from("players")
   .upsert(
    payload,
    {
     onConflict:"id"
    }
   );


  if(error){

   console.error(
    "SAVE ERROR:",
    error
   );

  }

 }catch(e){

  console.error(
   "SAVE EXCEPTION:",
   e
  );

 }finally{

  saving=false;

 }

}


/* =====================================================
   ОТРИСОВКА
===================================================== */

function render(){

 if(!player)
  return;


 document
  .getElementById("playerName")
  .textContent=
  "👤 "+(
   player.nickname ||
   "Моя империя"
  );


 document
  .getElementById("money")
  .textContent=
  fmt(player.money);


 document
  .getElementById("income")
  .textContent=
  fmt(totalIncome());


 document
  .getElementById("level")
  .textContent=
  getLevel();


 document
  .getElementById("xp")
  .textContent=
  Math.floor(
   Number(player.xp)||0
  )
   .toLocaleString("ru-RU");


 document
  .getElementById("buildings")
  .innerHTML=
  defs.map((d,i)=>{

   const count=
    Number(player[d.key])||0;

   const lvl=
    Number(player[d.key+"_level"])||1;

   const cost=
    buildingCost(i);

   const income=
    buildingIncome(i);


   return `

    <div class="card">

     <div class="icon">
      ${d.icon}
     </div>

     <div class="info">

      <div class="name">
       ${d.name} × ${count}
      </div>

      <div class="desc">
       Уровень ${lvl} · Следующий ${fmt(cost)}
      </div>

      <div class="income">
       +${fmt(income)}/мин
      </div>

     </div>

     <button
      type="button"
      onclick="buy(${i})"
      ${player.money<cost?"disabled":""}>

      Купить

     </button>

    </div>

   `;

  }).join("");

}


/* =====================================================
   РЕЙТИНГ
===================================================== */

async function loadLeaderboard(){

 const box=
  document.getElementById(
   "leaderboard"
  );


 try{

  const {
   data,
   error
  }=
  await db
   .from("leaderboard")
   .select(
    "id,nickname,xp,level"
   )
   .order(
    "xp",
    {
     ascending:false
    }
   )
   .limit(50);


  if(error){

   throw error;

  }


  if(!data || !data.length){

   box.innerHTML=`

    <div class="card">
     Пока игроков нет
    </div>

   `;

   return;

  }


  box.innerHTML=
   data.map((p,i)=>`

    <div class="rank">

     <div class="rank-left">

      <div class="rank-number">
       ${i+1}.
       ${i===0?"👑":
         i===1?"🥈":
         i===2?"🥉":"👤"}
      </div>

      <div class="rank-name">
       ${escapeHtml(p.nickname)}
      </div>

     </div>

     <div class="rank-right">

      <div class="rank-level">
       Уровень ${p.level}
      </div>

      <div class="rank-xp">
       ${Math.floor(Number(p.xp)||0)
        .toLocaleString("ru-RU")} XP
      </div>

     </div>

    </div>

   `).join("");


 }catch(error){

  console.error(
   "LEADERBOARD ERROR:",
   error
  );


  box.innerHTML=`

   <div class="card">
    ⚠️ Рейтинг пока недоступен
   </div>

  `;

 }

}

/* =====================================================
   АДМИН-ПАНЕЛЬ
===================================================== */

function openAdmin(){

 const pin=
  prompt(
   "🔐 PIN администратора"
  );


 if(pin==="2026"){

  document
   .getElementById("admin")
   .classList
   .remove("hidden");

 }else{

  showToast(
   "❌ Неверный PIN"
  );

 }

}


function closeAdmin(){

 document
  .getElementById("admin")
  .classList
  .add("hidden");

}


function adminAdd(amount){

 if(!player)
  return;

 player.money=
  Number(player.money||0)+
  amount;

 savePlayer();

 render();

 showToast(
  "+"+fmt(amount)
 );

}


function adminHour(){

 if(!player)
  return;

 player.money=
  Number(player.money||0)+
  totalIncome()*60;

 player.xp=
  Number(player.xp||0)+
  60;

 savePlayer();

 render();

 showToast(
  "🕐 Добавлен 1 час дохода"
 );

}


function adminBuilding(key){

 if(!player)
  return;

 player[key]=
  (Number(player[key])||0)+1;

 player.xp=
  Number(player.xp||0)+
  25;

 savePlayer();

 render();

 showToast(
  "🏗️ Здание добавлено"
 );

}


function adminMultiplier(value){

 if(!player)
  return;

 player.multiplier=value;

 savePlayer();

 render();

 showToast(
  "⚡ Доход ×"+value
 );

}


async function adminReset(){

 if(!player)
  return;


 if(!confirm(
  "Точно сбросить весь город?"
 ))
  return;


 player.money=10000;

 player.house=0;
 player.shop=0;
 player.gas=0;
 player.factory=0;

 player.house_level=1;
 player.shop_level=1;
 player.gas_level=1;
 player.factory_level=1;

 player.xp=0;
 player.multiplier=1;

 player.last_income_at=
  new Date().toISOString();


 await savePlayer();

 render();

 closeAdmin();

 showToast(
  "♻️ Город сброшен"
 );

}


/* =====================================================
   СКРЫТОЕ ДОЛГОЕ НАЖАТИЕ
===================================================== */

const logo=
 document.getElementById("logo");


function startAdminPress(){

 clearTimeout(
  adminPressTimer
 );

 adminPressTimer=
  setTimeout(
   openAdmin,
   1200
  );

}


function stopAdminPress(){

 clearTimeout(
  adminPressTimer
 );

}


logo.addEventListener(
 "touchstart",
 startAdminPress,
 {passive:true}
);

logo.addEventListener(
 "touchend",
 stopAdminPress
);

logo.addEventListener(
 "touchcancel",
 stopAdminPress
);

logo.addEventListener(
 "mousedown",
 startAdminPress
);

logo.addEventListener(
 "mouseup",
 stopAdminPress
);

logo.addEventListener(
 "mouseleave",
 stopAdminPress
);
