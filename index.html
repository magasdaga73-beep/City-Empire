<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>🏙️ Построй Империю</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080b10;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
 max-width:520px;
 margin:auto;
 min-height:100vh;
 padding:14px 14px 40px;
}

header{
 background:linear-gradient(145deg,#182131,#0e131c);
 border:1px solid #293548;
 border-radius:26px;
 padding:20px;
 box-shadow:0 15px 45px #0008;
}

.logo{
 text-align:center;
 user-select:none;
}

.logo h1{
 margin:0;
 font-size:27px;
}

.sub{
 color:#8793a7;
 font-size:13px;
 margin-top:5px;
}

.user{
 margin-top:14px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#0a0e14;
 padding:10px 12px;
 border-radius:14px;
}

.user span{
 color:#9da9ba;
 font-size:13px;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:15px;
}

.stat{
 background:#0b1017;
 border-radius:16px;
 padding:12px;
}

.label{
 font-size:11px;
 color:#7e8a9e;
}

.value{
 font-size:20px;
 font-weight:900;
 margin-top:3px;
}

.section{
 font-size:19px;
 font-weight:900;
 margin:20px 4px 10px;
}

.card{
 background:#121821;
 border:1px solid #263142;
 border-radius:20px;
 padding:14px;
 margin-bottom:10px;
 display:flex;
 align-items:center;
 gap:11px;
}

.icon{
 width:45px;
 font-size:32px;
 text-align:center;
}

.info{
 flex:1;
 min-width:0;
}

.name{
 font-weight:900;
}

.desc{
 color:#818da0;
 font-size:12px;
 margin-top:3px;
}

.income{
 color:#62e69a;
 font-size:13px;
 margin-top:5px;
}

button{
 border:0;
 border-radius:13px;
 padding:11px 13px;
 background:#fff;
 color:#101319;
 font-weight:900;
 font-size:13px;
}

button:disabled{
 opacity:.3;
}

.secondary{
 background:#222c3b;
 color:#fff;
}

.danger{
 background:#c94150;
 color:#fff;
}

.modal{
 position:fixed;
 inset:0;
 background:#000d;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:20;
}

.box{
 width:min(420px,100%);
 background:#141a23;
 border:1px solid #303b4d;
 border-radius:25px;
 padding:22px;
 box-shadow:0 20px 70px #000;
}

input{
 width:100%;
 padding:14px;
 border-radius:14px;
 border:1px solid #394456;
 background:#0a0e14;
 color:white;
 font-size:16px;
 margin:8px 0;
 outline:none;
}

.error{
 color:#ff7180;
 font-size:13px;
 min-height:20px;
 margin:4px 0;
}

.hidden{
 display:none!important;
}

.tabs{
 display:flex;
 gap:7px;
 margin-bottom:12px;
}

.tabs button{
 flex:1;
 background:#202a38;
 color:#fff;
}

.tabs button.active{
 background:#fff;
 color:#111;
}

.rank{
 background:#121821;
 border:1px solid #263142;
 border-radius:16px;
 padding:12px;
 margin-bottom:8px;
 display:flex;
 justify-content:space-between;
}

footer{
 text-align:center;
 color:#596577;
 font-size:11px;
 margin-top:25px;
}
</style>
</head>

<body>

<div id="auth" class="modal">
 <div class="box">

  <h2 id="authTitle">🏙️ Построй Империю</h2>

  <div class="tabs">
   <button id="loginTab" class="active" onclick="showLogin()">Войти</button>
   <button id="registerTab" onclick="showRegister()">Регистрация</button>
  </div>

  <div id="registerNickWrap" class="hidden">
   <input id="nickname" maxlength="24" placeholder="Название империи">
  </div>

  <input id="email" type="email" placeholder="E-mail">
  <input id="password" type="password" placeholder="Пароль">

  <div id="authError" class="error"></div>

  <button id="authButton" style="width:100%" onclick="authAction()">
   Войти
  </button>

 </div>
</div>


<div class="app">

<header>

 <div class="logo" id="logo">
  <h1>🏙️ Построй Империю</h1>
  <div class="sub">Твоя экономика. Твой город.</div>
 </div>

 <div class="user">
  <span id="playerName">Загрузка...</span>
  <button class="secondary" onclick="logout()">Выйти</button>
 </div>

 <div class="stats">

  <div class="stat">
   <div class="label">БАЛАНС</div>
   <div class="value" id="money">0 ₽</div>
  </div>

  <div class="stat">
   <div class="label">ДОХОД / МИН</div>
   <div class="value" id="income">0 ₽</div>
  </div>

  <div class="stat">
   <div class="label">УРОВЕНЬ</div>
   <div class="value" id="level">1</div>
  </div>

  <div class="stat">
   <div class="label">XP</div>
   <div class="value" id="xp">0</div>
  </div>

 </div>

</header>


<div class="section">🏗️ Строительство</div>

<div id="buildings"></div>


<div class="section">🏆 Рейтинг</div>

<div id="leaderboard">
 <div class="card">Загрузка рейтинга...</div>
</div>


<footer>
 ☁️ Сохранение в облаке Supabase
</footer>

</div>


<script>

const SUPABASE_URL =
"https://xwlwhcghadlwlmfzsxhp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-PLNU91ClWlotB7n2iz8g_3tvI1Th8";


const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


const defs = [
 {
  key:"house",
  icon:"🏠",
  name:"Дом",
  baseCost:2000,
  income:100
 },
 {
  key:"shop",
  icon:"🏪",
  name:"Магазин",
  baseCost:7500,
  income:450
 },
 {
  key:"gas",
  icon:"⛽",
  name:"АЗС",
  baseCost:20000,
  income:1200
 },
 {
  key:"factory",
  icon:"🏭",
  name:"Завод",
  baseCost:60000,
  income:4000
 }
];


let player = null;
let isRegister = false;
let saving = false;


/* ---------- AUTH ---------- */

function showLogin(){

 isRegister=false;

 document.getElementById("loginTab").classList.add("active");
 document.getElementById("registerTab").classList.remove("active");

 document.getElementById("registerNickWrap").classList.add("hidden");

 document.getElementById("authButton").textContent="Войти";
}


function showRegister(){

 isRegister=true;

 document.getElementById("registerTab").classList.add("active");
 document.getElementById("loginTab").classList.remove("active");

 document.getElementById("registerNickWrap").classList.remove("hidden");

 document.getElementById("authButton").textContent="Создать аккаунт";
}


async function authAction(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const error=document.getElementById("authError");

 error.textContent="";

 if(!email || !password){
  error.textContent="Заполни e-mail и пароль";
  return;
 }

 if(password.length<6){
  error.textContent="Пароль минимум 6 символов";
  return;
 }

 document.getElementById("authButton").disabled=true;

 try{

  if(isRegister){

   const nickname=
    document.getElementById("nickname").value.trim()
    ||"Моя империя";

   const {data,error:e}=await db.auth.signUp({
    email,
    password
   });

   if(e) throw e;

   if(!data.user){
    throw new Error("Не удалось создать пользователя");
   }

   const {error:insertError}=await db
    .from("players")
    .insert({
     id:data.user.id,
     nickname:nickname
    });

   if(insertError) throw insertError;

   error.style.color="#62e69a";
   error.textContent=
    "Аккаунт создан. Проверь почту, если Supabase попросит подтверждение.";

  }else{

   const {error:e}=await db.auth.signInWithPassword({
    email,
    password
   });

   if(e) throw e;

  }

 }catch(e){

  error.style.color="#ff7180";
  error.textContent=e.message;

 }finally{

  document.getElementById("authButton").disabled=false;

 }
}


async function logout(){

 await db.auth.signOut();

 location.reload();

}


/* ---------- PLAYER ---------- */

async function loadPlayer(){

 const {data:{user}}=await db.auth.getUser();

 if(!user){

  document.getElementById("auth").classList.remove("hidden");
  return;

 }

 const {data,error}=await db
  .from("players")
  .select("*")
  .eq("id",user.id)
  .single();

 if(error){

  console.error(error);

  document.getElementById("authError").textContent=
   "Не удалось загрузить город";

  return;
 }

 player=data;

 document.getElementById("auth").classList.add("hidden");

 applyOfflineIncome();

 render();

 loadLeaderboard();
}


function applyOfflineIncome(){

 if(!player.last_income_at) return;

 const last=new Date(player.last_income_at).getTime();

 const now=Date.now();

 let minutes=(now-last)/60000;

 minutes=Math.max(0,Math.min(minutes,1440));

 const gain=totalIncome()*minutes;

 if(gain>0){

  player.money+=Math.floor(gain);
  player.xp+=Math.floor(minutes);

 }

 player.last_income_at=new Date().toISOString();

 savePlayer();
}


/* ---------- ECONOMY ---------- */

function buildingIncome(i){

 const d=defs[i];

 const count=player[d.key]||0;

 const level=player[d.key+"_level"]||1;

 return count*d.income*level;
}


function totalIncome(){

 let income=0;

 defs.forEach((d,i)=>{
  income+=buildingIncome(i);
 });

 return income*(player.multiplier||1);
}


function buildingCost(i){

 const d=defs[i];

 const count=player[d.key]||0;

 return Math.floor(
  d.baseCost*Math.pow(1.18,count)
 );
}


function level(){

 return 1+
 Math.floor((player.xp||0)/100);
}


function fmt(n){

 return Math.floor(n).toLocaleString("ru-RU")+" ₽";
}


/* ---------- BUY ---------- */

async function buy(i){

 const d=defs[i];

 const cost=buildingCost(i);

 if(player.money<cost) return;

 player.money-=cost;
 player[d.key]=(player[d.key]||0)+1;
 player.xp+=25;

 render();
 await savePlayer();

}


/* ---------- SAVE ---------- */

async function savePlayer(){

 if(!player || saving) return;

 saving=true;

 const payload={
  id:player.id,
  nickname:player.nickname,
  money:Math.floor(player.money),

  house:player.house,
  shop:player.shop,
  gas:player.gas,
  factory:player.factory,

  house_level:player.house_level,
  shop_level:player.shop_level,
  gas_level:player.gas_level,
  factory_level:player.factory_level,

  xp:Math.floor(player.xp),
  multiplier:player.multiplier,

  last_income_at:new Date().toISOString(),
  updated_at:new Date().toISOString()
 };

 const {error}=await db
  .from("players")
  .upsert(payload);

 if(error) console.error(error);

 saving=false;
}


/* ---------- UI ---------- */

function render(){

 document.getElementById("playerName").textContent=
  "👤 "+player.nickname;

 document.getElementById("money").textContent=
  fmt(player.money);

 document.getElementById("income").textContent=
  fmt(totalIncome());

 document.getElementById("level").textContent=
  level();

 document.getElementById("xp").textContent=
  Math.floor(player.xp).toLocaleString("ru-RU");


 document.getElementById("buildings").innerHTML=
 defs.map((d,i)=>{

  const count=player[d.key]||0;
  const lvl=player[d.key+"_level"]||1;
  const cost=buildingCost(i);
  const income=buildingIncome(i);

  return `
   <div class="card">

    <div class="icon">${d.icon}</div>

    <div class="info">

     <div class="name">
      ${d.name} × ${count}
     </div>

     <div class="desc">
      Уровень ${lvl} · Цена ${fmt(cost)}
     </div>

     <div class="income">
      +${fmt(income)}/мин
     </div>

    </div>

    <button
      onclick="buy(${i})"
      ${player.money<cost?"disabled":""}>
      Купить
    </button>

   </div>
  `;

 }).join("");

}


/* ---------- LEADERBOARD ---------- */

async function loadLeaderboard(){

 const box=document.getElementById("leaderboard");

 const {data,error}=await db
  .from("players")
  .select("nickname,xp,money")
  .order("xp",{ascending:false})
  .limit(10);

 if(error){

  box.innerHTML=
   `<div class="card">Рейтинг пока недоступен</div>`;

  console.error(error);

  return;
 }

 if(!data.length){

  box.innerHTML=
   `<div class="card">Пока игроков нет</div>`;

  return;
 }

 box.innerHTML=data.map((p,i)=>`

  <div class="rank">

   <div>
    ${i+1}. 👑 ${escapeHtml(p.nickname)}
   </div>

   <div>
    ${Math.floor(p.xp).toLocaleString("ru-RU")} XP
   </div>

  </div>

 `).join("");

}


function escapeHtml(text){

 return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* ---------- GAME LOOP ---------- */

setInterval(async()=>{

 if(!player) return;

 const income=totalIncome();

 player.money+=income/60;

 player.xp+=0.1;

 render();

},1000);


setInterval(()=>{

 if(player) savePlayer();

},15000);


/* ---------- START ---------- */

db.auth.onAuthStateChange((event,session)=>{

 if(session){
  setTimeout(loadPlayer,100);
 }

});


loadPlayer();

</script>

</body>
</html>
